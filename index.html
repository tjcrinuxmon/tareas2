<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-ine-reducido.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INE · DEAJ — Módulo de Tareas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'ine-purple':       '#674092',
              'ine-purple-dark':  '#49276F',
              'ine-purple-xdark': '#2A1239',
              'ine-purple-light': '#9680B4',
              'ine-magenta':      '#49276F',
              'ine-magenta-dark': '#49276F',
              'ine-bg':           '#F8F5FB',
              'ine-bg-hover':     '#F3EDF9',
              'ine-border':       '#E2D9EE',
              'ine-border-light': '#EDE8F4',
              'ine-text':         '#1A1219',
              'ine-muted':        '#6B5F78',
              'ine-dim':          '#A090B0',
              'dir-blue':   '#3B82F6',
              'dir-green':  '#10B981',
              'dir-amber':  '#F59E0B',
              'dir-purple': '#8B5CF6',
              'dir-red':    '#EF4444',
              'dir-teal':   '#14B8A6',
            },
            fontFamily: {
              sans: ['Arial', 'Helvetica', 'system-ui', 'sans-serif'],
            },
            boxShadow: {
              'ine-card': '0 2px 8px rgba(103,64,146,.07)',
              'ine-modal': '0 20px 60px rgba(103,64,146,.20)',
              'ine-btn': '0 3px 10px rgba(103,64,146,.28)',
              'ine-btn-mg': '0 3px 10px rgba(73,39,111,.28)',
            }
          }
        }
      }
    </script>
    <style>
      * { box-sizing: border-box; }
      body { font-family: Arial, Helvetica, system-ui, sans-serif; font-size: 14px; line-height: 1.5; }
      input, select, textarea, button { font-family: Arial, Helvetica, system-ui, sans-serif; }

      /* Scrollbars */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #EDE8F4; }
      ::-webkit-scrollbar-thumb { background: #C4A8DC; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #9B7BB8; }

      /* Horizontal scrollbar for data tables — más gruesa */
      .table-hscroll::-webkit-scrollbar { height: 10px; }
      .table-hscroll::-webkit-scrollbar-track { background: #EDE8F4; border-radius: 5px; }
      .table-hscroll::-webkit-scrollbar-thumb { background: #9B7BB8; border-radius: 5px; }
      .table-hscroll::-webkit-scrollbar-thumb:hover { background: #674092; }

      /* Animations */
      @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
      .fade-in { animation: fadeIn 0.18s ease-out; }
      .progress-bar-fill { transition: width 0.5s ease-in-out; }

      /* INE Diamond */
      .ine-diamond {
        display: inline-block;
        transform: rotate(45deg);
        background: #49276F;
        border-radius: 2px;
        flex-shrink: 0;
      }

      /* ── Botón Primario PIDI (btn.primario) ─────────────────────
         Fondo: #674092  |  Padding: 12px 24px  |  Texto: blanco
         Estados: hover → #49276F  |  pressed → #2A1239
         Focus: anillo magenta  |  Inactivo: opacity 0.45
      ───────────────────────────────────────────────────────── */
      .btn-ine, .btn-mg {
        background: #674092;
        color: white;
        padding: 12px 24px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        box-shadow: 0 2px 6px rgba(103,64,146,.30);
        transition: background .18s, box-shadow .18s, transform .18s;
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn-ine:hover, .btn-mg:hover {
        background: #49276F;
        box-shadow: 0 4px 14px rgba(103,64,146,.40);
        transform: translateY(-1px);
      }
      .btn-ine:active, .btn-mg:active {
        background: #2A1239;
        transform: translateY(0);
        box-shadow: 0 1px 3px rgba(103,64,146,.20);
      }
      .btn-ine:focus-visible, .btn-mg:focus-visible {
        outline: 3px solid rgba(103,64,146,.45);
        outline-offset: 2px;
      }
      .btn-ine:disabled, .btn-mg:disabled {
        opacity: 0.45;
        transform: none;
        cursor: not-allowed;
        box-shadow: none;
      }

      /* ── Botón Secundario PIDI (btn.secundario) ──────────────── */
      .btn-outline {
        background: white;
        color: #674092;
        border: 1.5px solid #674092;
        padding: 11px 23px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all .18s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn-outline:hover { background: rgba(103,64,146,.06); box-shadow: 0 2px 8px rgba(103,64,146,.18); }
      .btn-outline:active { background: rgba(103,64,146,.12); }
      .btn-outline:focus-visible { outline: 3px solid rgba(103,64,146,.35); outline-offset: 2px; }
      .btn-outline:disabled { opacity: 0.45; cursor: not-allowed; }

      /* Card */
      .ine-card {
        background: white;
        border: 1.5px solid #E2D9EE;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(103,64,146,.07);
      }

      /* Input */
      .ine-input {
        background: white;
        border: 1.5px solid #E2D9EE;
        border-radius: 6px;
        font-size: 14px;
        padding: 10px 14px;
        width: 100%;
        font-family: inherit;
        color: #1A1219;
        transition: border-color .15s, box-shadow .15s;
        outline: none;
      }
      .ine-input:focus { border-color: #674092; box-shadow: 0 0 0 3px rgba(103,64,146,.13); }
      .ine-input::placeholder { color: #A090B0; }

      .ine-label {
        font-size: 12px;
        font-weight: 700;
        color: #575453;
        display: block;
        margin-bottom: 8px;
      }

      /* Field messages — 4px below the input */
      .ine-field-error {
        font-size: 12px;
        color: #B91C1C;
        margin-top: 4px;
        display: block;
      }
      .ine-field-help {
        font-size: 12px;
        color: #6B5F78;
        margin-top: 4px;
        display: block;
      }

      /* Required asterisk */
      .ine-required {
        color: #B91C1C;
        margin-left: 2px;
      }
    </style>
  </head>
  <body class="bg-ine-bg text-ine-text">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
